name: Compilar SteamDB APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar motor Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar archivo APK
        run: gradle assembleDebug --no-daemon

      - name: Publicar APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: SteamDB-Pocket-APK
          path: app/build/outputs/apk/debug/app-debug.apk
